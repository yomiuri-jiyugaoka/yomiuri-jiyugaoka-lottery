<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ガラガラ抽選会</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="stage">

  <div class="booth-header">
    <button class="icon-btn" id="muteBtn" title="音のオン/オフ">🔊</button>
    <a class="icon-btn" id="adminLink" href="admin.html" title="スタッフ設定">⚙️</a>
    <div class="noren-title">ガラガラ抽選会</div>
    <div class="center-name" id="centerNameLabel"></div>
  </div>

  <div class="drum-wrap">
    <div class="drum-frame">
      <span class="sparkle sp1">✨</span>
      <span class="sparkle sp2">⭐</span>
      <span class="sparkle sp3">✨</span>
      <span class="sparkle sp4">🎉</span>
      <span class="sparkle sp5">⭐</span>
      <img class="drum-svg" id="drumSvg" src="garapon-drum.png" alt="ガラガラ抽選機">
      <div class="ball-pop" id="ballPop"></div>
    </div>
    <div class="chute"></div>
  </div>

  <div class="ticket" id="ticket">
    <div class="label">抽選結果</div>
    <div id="ticketBody"></div>
  </div>

  <button class="spin-btn" id="spinBtn">ガラガラ回す！</button>

  <section style="width:100%">
    <div class="board-title">景品</div>
    <div class="prize-board" id="prizeBoard"></div>
  </section>

  <section class="history">
    <div class="board-title">抽選履歴（最新3件）</div>
    <ul id="historyList"></ul>
  </section>

  <div class="staff-link-row">
    <a href="admin.html">スタッフの方はこちら（景品の設定）</a>
  </div>

</div>

<script src="supabase-client.js"></script>
<script>
let muted = loadMuted();
let isSpinning = false;

// ---------- sound ----------
let audioCtx = null;
function ctx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq, start, dur, type='sine', vol=0.18){
  if(muted) return;
  const c = ctx();
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(0, c.currentTime+start);
  g.gain.linearRampToValueAtTime(vol, c.currentTime+start+0.02);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+start+dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime+start);
  o.stop(c.currentTime+start+dur+0.05);
}
function playTumble(){
  for(let i=0;i<10;i++){
    beep(300+Math.random()*200, i*0.16, 0.08, 'square', 0.08);
  }
}
function playFanfare(){
  [523.25,659.25,783.99,1046.5].forEach((f,i)=> beep(f, i*0.11, 0.28, 'triangle', 0.2));
}
function playEmpty(){
  beep(220,0,0.3,'sawtooth',0.15);
  beep(180,0.15,0.3,'sawtooth',0.15);
}

// ---------- render ----------
async function renderPrizes(){
  const prizes = await fetchPrizes();
  const board = document.getElementById('prizeBoard');
  board.innerHTML = '';
  prizes.forEach(p=>{
    const card = document.createElement('div');
    const rankClass = p.rank_tier ? ` rank-${p.rank_tier}` : '';
    card.className = 'prize-card' + (p.remaining<=0 ? ' depleted':'') + rankClass;
    const badge = p.rank_tier ? `<div class="rank-badge">${p.rank_tier===1?'🏆':p.rank_tier===2?'🥈':'🥉'}${p.rank_tier}等</div>` : '';
    card.innerHTML = `
      ${badge}
      <div class="p-emoji">${p.emoji||'🎁'}</div>
      <div class="p-name">${escapeHtml(p.name)}</div>
    `;
    board.appendChild(card);
  });
}

async function renderHistory(){
  const history = await fetchHistory(3);
  const hist = document.getElementById('historyList');
  hist.innerHTML = '';
  history.forEach(h=>{
    const d = new Date(h.drawn_at);
    const dateStr = (d.getMonth()+1)+'/'+d.getDate();
    const time = d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
    const li = document.createElement('li');
    li.innerHTML = `<span>${h.emoji||''} ${escapeHtml(h.name)}</span><span class="time mono">${dateStr} ${time}</span>`;
    hist.appendChild(li);
  });
}

async function renderCenterName(){
  const settings = await fetchSettings();
  document.getElementById('centerNameLabel').textContent = settings.center_name;
}

// ---------- drawing ----------
async function draw(){
  if(isSpinning) return;
  const spinBtn = document.getElementById('spinBtn');
  const drum = document.getElementById('drumSvg');
  const ticket = document.getElementById('ticket');
  const ticketBody = document.getElementById('ticketBody');
  const ballPop = document.getElementById('ballPop');

  ticket.classList.remove('show');
  isSpinning = true;
  spinBtn.disabled = true;
  spinBtn.textContent = 'まわしています…';
  drum.classList.add('spinning');
  playTumble();

  const resultPromise = drawPrizeRemote();
  const minWait = new Promise(res=> setTimeout(res, 1600));
  const [result] = await Promise.all([resultPromise, minWait]);

  drum.classList.remove('spinning');
  spinBtn.disabled = false;
  spinBtn.textContent = 'ガラガラ回す！';
  isSpinning = false;

  if(!result){
    ticketBody.innerHTML = `<div class="empty-msg">通信エラーが発生しました。もう一度お試しください。</div>`;
    requestAnimationFrame(()=> ticket.classList.add('show'));
    return;
  }

  if(result.soldOut){
    playEmpty();
    ticketBody.innerHTML = `<div class="empty-msg">すべての景品が終了しました🙏<br>スタッフまでお声がけください</div>`;
    requestAnimationFrame(()=> ticket.classList.add('show'));
    return;
  }

  ballPop.classList.remove('pop-anim');
  void ballPop.offsetWidth;
  ballPop.classList.add('pop-anim');

  ticket.classList.remove('rank-1','rank-2','rank-3');
  const rankBadge = result.rankTier ? `<div class="ticket-rank-badge">${result.rankTier===1?'🏆 1等 🏆':result.rankTier===2?'🥈 2等 🥈':'🥉 3等 🥉'}</div>` : '';
  if(result.rankTier) ticket.classList.add('rank-'+result.rankTier);

  ticketBody.innerHTML = `
    ${rankBadge}
    <div class="emoji">${result.emoji||'🎁'}</div>
    <div class="prize-name">${escapeHtml(result.name)}</div>
  `;
  requestAnimationFrame(()=> ticket.classList.add('show'));
  playFanfare();
  launchConfetti(result.rankTier ? 70 : 34);

  // 自分の画面はすぐ更新（他の端末はRealtime経由で自動更新されます）
  renderPrizes();
  renderHistory();
}

function launchConfetti(count){
  const colors = ['#c8353f','#e8a93a','#f6c85f','#4a7c59','#fffaf2'];
  const total = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : (count||34);
  for(let i=0;i<total;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random()*100+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (2.2+Math.random()*1.6)+'s';
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    setTimeout(()=> el.remove(), 4200);
  }
}

document.getElementById('spinBtn').addEventListener('click', draw);
document.getElementById('muteBtn').addEventListener('click', ()=>{
  muted = !muted;
  saveMuted(muted);
  document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
});

document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';

subscribeLotteryRealtime({
  onPrizesChange: renderPrizes,
  onHistoryChange: renderHistory
});

renderCenterName();
renderPrizes();
renderHistory();
</script>
</body>
</html>
